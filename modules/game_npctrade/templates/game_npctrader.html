<style>
    /* ==============================================================================================
       UTILITIES & SHARED CLASSES
       ============================================================================================== */
    /* Layout Helpers */
    .flex { display: flex; }
    .block { display: block; }
    .inlineBlock { display: inline-block; }
    .fullWidth { width: 100%; }
    
    /* Typography */
    .fontText { font: verdana-11px-monochrome; }
    .fontTitle { font: verdana-11px-monochrome; }
    .tradeCommand { --image-source: /images/ui/buttons; --image-clip: 0 0 43 20; --image-border: 1; --text-offset: 0 0; --text-align: center; text-align: center; color: #dfdfdf; padding: 0; }
    .tradeCommand:active { --image-clip: 0 20 43 20; }
    .tradeCommand:disabled { color: #b6b6b6; }
    
    /* Color Palette */
    .colorGrey { color: #cccccc; }
    .colorWhite { color: #ffffff; }
    .colorLightGrey { color: #aaaaaa; }
    .colorItemGrey { color: #c0c0c0; }
    .bgDark { background: #222222; }
    
    /* Borders & Box Models */
    .iconBox { width: 40px; height: 40px; flex-shrink: 0; min-width: 40px; --virtual: true}
    .borderGrey { border: 1 #444444; }
    .sunkenBorder { --border-width-top: 1; --border-color-top: #141414; --border-width-left: 1; --border-color-left: #141414; --border-width-bottom: 1; --border-color-bottom: #747474; --border-width-right: 1; --border-color-right: #747474; }
    .panelBase { width: 351px; display: block; margin-left: 14px; }
    .windowBtn { width: 12px; height: 12px; --image-source: /images/ui/miniwindow_buttons; --image-size: 14 14; margin-top: 7px; }

    /* ==============================================================================================
       MAIN WINDOW & STRUCTURE
       ============================================================================================== */
    .modal-message { width: 395px; height: 480px; display: block; --image-source: /images/ui/window_new; --image-border: 6; --image-border-top: 27; padding: 0; }
    .leftPanel { width: 395px; height: 480px; float: left; }
    .rightPanel { width: 300px; height: 448px; margin-top: 27px; margin-left: 9px; float: left; position: relative; }
    .verticalSep { height: 442px; margin-top: 26px; float: left; margin-left: 0px; }
    .dragHandle { height: 27px; background-color: alpha; }
    .closeButton { --image-clip: 28 0 14 14; margin-right: 10px; }
    .closeButton:hover { --image-clip: 28 14 14 14; }
    .closeButton:active { --image-clip: 28 28 14 14; }
    .bottonOptions { --image-clip: 112 0 14 14; margin-right: 25px; }
    .bottonOptions:hover { --image-clip: 112 14 14 14; }
    .bottonOptions:active { --image-clip: 112 28 14 14; }

    /* ==============================================================================================
       NPC INTERACTION (LEFT PANEL)
       ============================================================================================== */
    /* Header & Visuals */
    .img { display: block; width: 270px; height: 28px; margin-left: 108px; margin-top: 42px; }
    .title { display: block; margin-left: 126px; margin-top: 48px; width: 232px; height: 18px; font: verdana-11px-monochrome; text-align: left; --text-wrap: false; }
    .podium { display: block; width: 96px; height: 100px; margin-left: 12px; margin-top: 8px; }
    .creature-display { display: block; width: 152px; height: 152px; margin-left: -32px; margin-top: -32px; --creature-center: true; }

    .portrait-fallback { display: block; width: 56px; height: 56px; margin-left: 32px; margin-top: 28px; }

    .npcPortraitViewport { display: block; width: 88px; height: 88px; margin-left: 16px; margin-top: 12px; overflow: hidden; }

    /* Chat & Console */
    .panelConsole { margin-top: 120px; --image-border: 4; padding: 4; padding-right: 12; padding-left: 4; --image-source: /images/ui/3pixel_frame_borderimage; }
    .inputConsole { height: 22px; margin-bottom: 12px; display: inline-block; width: 287px; margin-left: 14px; --placeholder: "Type here to chat"; --placeholder-color: #909090; }
    .bottonChat { width: 70px; height: 22px; margin-left: 311px; margin-bottom: 12px; font: verdana-11px-monochrome; text-align: center; padding: 0; }
    
    /* Buttons Panel */
    .panelBotons { margin-bottom: 46px; --focusable: false; width: 367px; margin-left: 14px; display: block; overflow: hidden; }
    .npc-button { width: 24px; height: 24px; padding: 0; flex-shrink: 0; --icon-source: /game_npctrade/assets/images/icons-npcdialog; --icon-align: center; margin-right: 2px; margin-bottom: 4px; }

    /* ==============================================================================================
       TRADE INTERFACE (RIGHT PANEL)
       ============================================================================================== */
    /* Trade Header */
    .tradeHeader { height: 66px; width: 300px; margin-left: 0px; margin-top: 0px; }
    .currencySection { display: block; width: 240px; height: 38px; margin-left: 0px; margin-top: 0px; }
    .tradeCurrencyName { display: block; height: 16px; width: 240px; margin-left: 0px; margin-top: 18px; }
    .tradeCurrencyIcon {  margin-right: 4px; margin-top: 0px; }
    .tradeTabs { width: 300px; height: 22px; margin-left: 0px; margin-top: 44px; }
    .tradeTab { width: 94px; height: 22px; margin-top: 0px; padding: 0; }
    .bottonTrade { --image-clip: 28 0 14 14; margin-right: 40px; }
    .bottonTrade:hover { --image-clip: 28 14 14 14; }
    .bottonTrade:active { --image-clip: 28 28 14 14; }

    /* Item List */
    .tradeListScroll { height: 204px; width: 300px; margin-top: 72px; margin-left: 0px; background-color: #404040; overflow: scroll; }
    .tradeScrollBar { width: 15px; height: 215px; margin-right: 2px; background-color: #222222; }
    .itemListContainer { width: 175px; height: 215px; }
    .tradeListItem { height: 48; padding: 4 4; border: 1 transparent; margin-left: 2px; margin-top: 2px; }
    .tradeListItem:nth-child(odd) { background-color: #383838; }
    .tradeListItem:hover { background-color: #505050; }
    .tradeListItem:focus { background-color: #585858; }
    .tradeListItemSelected { background-color: #224466; border: 1 #336699; }
    .itemInfoBlock { display: block; margin-left: 8px; flex-grow: 1; flex-shrink: 1; overflow: hidden; }
    .tradeItemName { display: block; width: 100%; height: 18px; --text-wrap: false; --text-offset: 0 0; }
    .tradeItemInfo { display: block; width: 100%; height: 18px; --text-wrap: false; }

    /* Search Bar */
    .tradeSearchRow { height: 22px; width: 300px; margin-top: 282px; margin-left: 0px; }
    .tradeSearchInput { margin-left: 0px; margin-top: 0px; width: 274px; height: 22px; --placeholder: "Type to search"; --placeholder-color: #909090; padding: 0; }
    .tradeSearchClear { display: block; --image-source: /game_cyclopedia/images/button_clear_search; margin-right: 2px; margin-top: 2px; width: 18px; height: 18px; }

    /* Trade Footer & Controls */
    .tradeFooter { height: 135px; width: 300px; margin-left: 0px; margin-top: 310px; }
    .tradeTopRow { margin-left: 4px; margin-top: 18px; width: 244px; height: 12px; }
    #amountScrollBar { width: 244px; height: 12px; }
    .tradePreviewBox { display: block; background: #1a1a1a; margin-right: 4px; margin-top: 36px; }
    .tradeBuyButton { width: 70px; height: 22px;  margin-right: 4px; margin-bottom: 4px; padding: 0; }
    .tradeRows { margin-left: 4px; margin-top: 36px; width: 244px; height: 54px; }
    .tradeRow { height: 18px; width: 244px; display: block; }
    .tradeFooterLabel { width: 55px; height: 18px;  margin-left: 0px; margin-top: 0px; }
    .tradeFooterValue { display: block; width: 184px; height: 18px; margin-left: 60px; margin-top: 0px; text-align: right; }
    .tradeFooterAmountInput { display: block; width: 184px; height: 18px; margin-left: 60px; margin-top: 0px; text-align: right; padding: 0; }
    .rashidSellAllButton { width: 80px; height: 22px;  margin-left: 4px; margin-bottom: 4px; padding: 0; }
    .rashidCancelSellButton { width: 72px; height: 22px;  margin-left: 90px; margin-bottom: 4px; padding: 0; }
    .rashidSellProgress { width: 292px; height: 14px; margin-left: 4px; margin-right: 4px; margin-top: 0px; background-color: #2f78c4; }
    .rashidSellProgressLabel { display: block; width: 292px; height: 14px; margin-left: 4px; margin-right: 4px; margin-top: 0px; text-align: center; }
</style>


<script type="text">
    self.isTradeOpen = false;
    self.tradeItems = {};
    self.selectedItem = nil;
    self.amount = 1;
    self.totalPrice = 0;
    self.totalWeight = "0.00";
</script>

<html>
<uiwindow id="windowTrader" placement="center" *width="self.widthConsole" class="modal-message"
    src="images/ui/miniwindow" onescape="self:onCloseNpcTrade()" onkeydown="self:onConsoleKeyPress(event)">

    <!-- Left Panel -->
    <div class="leftPanel" >
        <scrollablepanel *height="self.dialogConsoleHeight" id="consoleBuffer" inverted-scroll="true" always-scroll-maximum="true" class="panelConsole panelBase" style="overflow: scroll; padding: 4px;" layout="type: verticalBox; align-bottom: true" placement="top-left">
        </scrollablepanel>

        <img id="npcBanner" class="img" src="assets/images/blue-golden-flag-banner" placement="top-left" />
        <label id="npcName" class="title" placement="top-left" *tooltip="self.creatureName" *text="self.npcDisplayName"></label>
        <img class="podium" src="assets/images/backdrop-npcdialog-podestal" placement="top-left" />
        <div id="npcPortraitViewport" class="npcPortraitViewport" placement="top-left">
            <uicreature id="creatureOutfit" class="creature-display" placement="top-left"></uicreature>
        </div>
        <img id="npcPortraitFallback" class="portrait-fallback" src="assets/images/icon-npcdialog-multiplenpcs" placement="top-left" visible="false" />


        <div *height="self.dialogButtonsHeight" layout="type: grid; cell-size: 26 28; num-columns: 14" id="panelBotons" placement="bottom-left" class="panelBotons">
            <UIButton *for="local buttonData in self.buttons" *for-finished="self:onDialogButtonsRendered()" class="npc-button" *tooltip="buttonData.text"
                *icon-clip="self:getIconClip(buttonData.id)" onclick="self:onConsoleTextClicked(buttonData.text)"></UIButton>
        </div>
        <input id="chatInput" class="inputConsole" placement="bottom-left" />
        <UIButton id="chatModeButton" class="bottonChat tradeCommand" placement="bottom-left" *text="self.chatMode" onclick="self:toggleChatMode()"></UIButton>
    </div>

    <div class="verticalSep VerticalSeparator" *visible="self.isTradeOpen"></div>

    <!-- Right Panel (Trade) -->
    <div class="rightPanel" *visible="self.isTradeOpen">
        <!-- Header -->
        <div class="tradeHeader" placement="top-left">
            <div class="currencySection" placement="top-left">
                <label id="currencyCaption" class="fontText colorGrey" placement="top-left" style="display: block; height: 16px; width: 190px;" text="Currency:"></label>
                <label class="tradeCurrencyName fontText colorWhite" placement="top-left" text="Gold Coin"></label>
            </div>
            <UIItem class="tradeCurrencyIcon iconBox sunkenBorder" placement="top-right" item-id="3031" item-count="100" always-show-count="false" />
            <div class="tradeTabs" placement="top-left">
                <UIButton id="tabBuy" *width="self.rashidTrade and 94 or 146" class="tradeTab fontTitle tradeCommand" placement="top-left" style="margin-left: 0px;" text="Buy" onclick="self:setTradeMode(self.BUY)"></UIButton>
                <UIButton id="tabSell" *width="self.rashidTrade and 94 or 146" *margin-left="self.rashidTrade and 102 or 154" class="tradeTab fontTitle tradeCommand" placement="top-left" text="Sell" onclick="self:setTradeMode(self.SELL)"></UIButton>
                <UIButton id="tabBlacklist" class="tradeTab fontTitle tradeCommand" placement="top-left" style="margin-left: 204px;" text="Blacklist" *visible="self.rashidTrade" onclick="self:setTradeMode(self.BLACKLIST)"></UIButton>
            </div>
        </div>

        <!-- List Container -->
        <div id="tradeListScroll" placement="top-left" class="tradeListScroll borderGrey fullWidth sunkenBorder" layout="type: verticalBox">
            <div *for="local item in self.tradeItems" *for-finished="self:onTradeListRendered()" class="tradeListItem flex fullWidth"
                *trade-item="item"
                *class-tradeListItemSelected="self.selectedItem == item">
                <UIItem class="iconBox item" *item="item.ptr" />
                <div class="itemInfoBlock">
                    <label id="nameLabel" class="tradeItemName fontText" *text="short_text(item.name, 32)" *tooltip="self:getTradeItemTooltip(item)"></label>
                    <label id="infoLabel" class="tradeItemInfo fontText" *text="short_text('Price ' .. comma_value(item.price) .. ', ' .. string.format('%.2f', item.weight) .. ' oz', 36)" *tooltip="self:getTradeItemTooltip(item)"></label>
                </div>
            </div>
        </div>

        <!-- Search -->

        <div class="tradeSearchRow borderGrey bgDark" placement="top-left">
            <input class="tradeSearchInput fontText colorLightGrey" placement="top-left" onchange="self:filterTradeList(event.value)"/>
            <uibutton class="tradeSearchClear" placement="top-right" onclick="self:clearSearch()"></uibutton>
        </div>
        <!-- Footer -->
        <div class="tradeFooter" placement="top-left">

            <ProgressBar id="rashidSellProgress" class="rashidSellProgress" placement="top-left" visible="false" />
            <label id="rashidSellProgressLabel" class="rashidSellProgressLabel fontText colorWhite" placement="top-left" visible="false"></label>

            <!-- Scrollbar (top left) -->
            <div class="tradeTopRow" placement="top-left">
                <HorizontalScrollBar id="amountScrollBar" minimum="1" maximum="100" step="1"
                    onchange="self:onAmountScrollBarChange(event.value)" disabled />
            </div>

            <!-- Preview (right) -->
            <UIItem class="tradePreviewBox item borderGrey iconBox sunkenBorder" placement="top-right" *item="self.selectedItem and self.selectedItem.ptr or nil" />

            <!-- Buy button (bottom right) -->
            <UIButton id="toggleButton" class="tradeBuyButton fontTitle tradeCommand" placement="bottom-right" text="Buy" onclick="self:executeTrade()"></UIButton>
            <UIButton id="rashidSellAllButton" class="rashidSellAllButton fontTitle tradeCommand" placement="bottom-left" text="Sell All"
                *visible="self.rashidTrade and self.tradeMode == self.SELL"
                onclick="self:startRashidSellAllModern()"></UIButton>
            <UIButton id="rashidCancelSellButton" class="rashidCancelSellButton fontTitle tradeCommand" placement="bottom-left" text="Cancel"
                visible="false" onclick="self:cancelRashidSellAllModern()"></UIButton>

            <!-- Rows (left) -->
            <div class="tradeRows" placement="top-left">
                <div class="tradeRow">
                    <div class="tradeFooterLabel fontText colorGrey inlineBlock" placement="top-left">Amount:</div>
                    <input id="amountInput" class="tradeFooterAmountInput fontText colorWhite bgDark borderGrey inlineBlock" placement="top-left" *text="self.amount" onchange="self:onAmountInputChange(event)" />
                </div>

                <div class="tradeRow">
                    <div class="tradeFooterLabel fontText colorGrey inlineBlock" placement="top-left">Price:</div>
                    <label class="tradeFooterValue fontText colorWhite inlineBlock" placement="top-left">{{comma_value(self.totalPrice)}}</label>
                </div>

                <div class="tradeRow">
                    <div id="currencyBalanceCaption" class="tradeFooterLabel fontText colorGrey inlineBlock" placement="top-left" text="Balance:"></div>
                    <label id="playerMoneyDisplay" class="tradeFooterValue fontText colorWhite inlineBlock" placement="top-left" text="0"></label>
                </div>
            </div>

        </div>

    </div>

    <div id="dragHandle" class="dragHandle" placement="top-left" *width="self.widthConsole" focusable="false"></div>

    <UIButton class="bottonOptions windowBtn" placement="top-right" *visible="self.isTradeOpen" onclick="self:onOptionsClick()"></UIButton>
    <UIButton class="closeButton windowBtn" placement="top-right" onclick="self:onCloseNpcTrade()"></UIButton>

</uiwindow>

</html>
